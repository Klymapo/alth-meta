name: Voxel GLB - Modelo y capturas
on:
  push:
    branches: [experimentos/voxel-glb-codespaces]
    paths:
      - 'experimentos/voxel-glb/**'
      - '.github/workflows/voxel_glb_capturas.yml'
  workflow_dispatch:
    inputs:
      lado:
        description: Lado del cubo
        default: '1'
        required: true
      color:
        description: Color hexadecimal RGB
        default: '#5089C6'
        required: true
permissions:
  contents: read
jobs:
  entrega:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderizador de capturas
        run: python -m pip install -r experimentos/voxel-glb/requirements.txt
      - name: Generar GLB, cuatro vistas y manifiesto
        env:
          LADO: ${{ inputs.lado || '1' }}
          COLOR: ${{ inputs.color || '#5089C6' }}
        run: python experimentos/voxel-glb/entrega.py --lado "$LADO" --color "$COLOR" --salida salidas/entrega_001
      - name: Guardar evidencia descargable
        uses: actions/upload-artifact@v4
        with:
          name: voxel-glb-entrega-001
          path: salidas/entrega_001/
