name: COPOX · ALTH integration

on:
  pull_request:
    paths:
      - "copox/adapters/alth_character*.py"
      - "copox/adapters/alth_glb_*.py"
      - "copox/adapters/model_inventory.py"
      - "copox/state_bundle.py"
      - "copox/maturity/**"
      - "copox/baselines/**"
      - "copox/search_spaces/**"
      - "copox/reference_configs/**"
      - "copox/profiles/alth_character_alpha.json"
      - "copox/cassettes/examples/theo.json"
      - "assets/joven_rubio/theo_alpha.glb"
      - "alth/**"
      - ".github/workflows/copox-alth-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-real:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Preparar baseline Theo Alpha
        run: |
          rm -rf .copox/integration
          python3 -m copox.adapters.alth_character_alpha prepare \
            --repo-root . \
            --baseline-params copox/baselines/joven_rubio_alpha.json \
            --baseline-model assets/joven_rubio/theo_alpha.glb \
            --run-dir .copox/integration

      - name: Generar candidato estructurado de pelo
        run: |
          mkdir -p .copox/integration/candidates/t01-c02/evidence
          python3 -m copox.adapters.alth_character_alpha mutate \
            --baseline-params .copox/integration/baseline/params.json \
            --search-space copox/search_spaces/joven_rubio_alpha_hair.json \
            --run-dir .copox/integration \
            --candidate-dir .copox/integration/candidates/t01-c02 \
            --candidate-id t01-c02
          python3 -m copox.adapters.alth_character_alpha execute \
            --repo-root . \
            --baseline-model .copox/integration/baseline/model.glb \
            --edit-config copox/reference_configs/joven_rubio_alpha.json \
            --candidate-dir .copox/integration/candidates/t01-c02

      - name: Inventariar baseline real
        run: |
          python3 -m copox.adapters.model_inventory \
            --input .copox/integration/baseline/model.glb \
            --output .copox/integration/model_inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path('.copox/integration/model_inventory.json').read_text(encoding='utf-8'))
          assert inv['node_count'] == 16, inv['node_count']
          assert inv['group_counts']['hair'] == 12, inv['group_counts']
          assert inv['group_counts']['ears'] == 2, inv['group_counts']
          assert inv['group_counts']['body_or_head'] == 2, inv['group_counts']
          assert inv['groups']['ears'] == ['Oreja_izquierda_perfil','Oreja_derecha_perfil']
          assert len(inv['materials']) == 1, inv['materials']
          print('PASS: inventario semántico reproducible: 12 hair + 2 ears + 2 body/head')
          PY

      - name: Capturar y auditar Alpha contra referencia
        run: |
          python3 -m copox.adapters.alth_character_alpha capture \
            --candidate-dir .copox/integration/candidates/t01-c02 \
            --evidence-dir .copox/integration/candidates/t01-c02/evidence \
            --run-dir .copox/integration \
            --reference refs/personajes/joven-rubio-4-vistas.jpg \
            --audit-config copox/reference_configs/joven_rubio_alpha.json \
            --focus hair,profile

      - name: Verificar GLB aprobado, estructura y frozen regions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.copox/integration/candidates/t01-c02')
          required = [
              root/'model.glb', root/'hoja.png', root/'reporte.json', root/'metrics.json',
              root/'evidence'/'hoja.png', root/'evidence'/'overlay_front.png',
              root/'evidence'/'overlay_side.png', root/'evidence'/'overlay_back.png',
              root/'evidence'/'overlay_threeq.png', Path('.copox/integration/model_inventory.json')
          ]
          missing = [str(p) for p in required if not p.exists()]
          assert not missing, missing
          m = json.loads((root/'metrics.json').read_text(encoding='utf-8'))
          r = json.loads((root/'reporte.json').read_text(encoding='utf-8'))
          assert m['technical']['mesh_integrity'] is True
          assert m['technical']['spec_compliance'] is True
          assert m['registration']['coordinate_system']['vertical_axis'] == 2
          assert m['structure']['hair_structure_ok'] is True
          assert float(m['structure']['randomness_penalty_mm']) <= 0.75
          assert r['technical']['frozen_nodes_unchanged'] is True
          assert len(r['technical']['hair_nodes']) == 12
          assert r['orientation']['ok'] is True, r.get('orientation')
          bounds = r['orientation']['bounds']
          assert float(bounds['H']) > float(bounds['D']) * 1.25, bounds
          detail = m['regions']['detail']
          for frozen in ('torso','arms_hands','legs_feet'):
              assert abs(float(detail[frozen]['delta_pp'])) < 0.05, (frozen, detail[frozen])
          print('PASS: Theo Alpha seed + orientación + inventario + frozen regions + evidencia')
          PY

      - name: Guardar evidencia de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copox-theo-alpha-integration
          path: .copox/integration/
          retention-days: 1
          if-no-files-found: ignore
