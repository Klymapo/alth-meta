name: Bucle ALTH (cualquier IA)
run-name: "Bucle · ${{ inputs.asset }}"

# Corre el bucle de modelado en la nube de GitHub: gratis mientras el repo sea público
# y sin tener la computadora prendida. Se lanza a mano desde la pestaña "Actions" (también
# desde la app de GitHub en el celular): Actions → "Bucle ALTH" → Run workflow.
#
# Claves: Settings → Secrets and variables → Actions → New repository secret.
# Con "proveedor: auto" (el de fábrica) basta con configurar GEMINI_API_KEY, GROQ_API_KEY,
# o ambas: prueba Gemini y, si se topa con la cuota del día o falla, brinca solo a Groq.
# Si eliges un proveedor específico, solo hace falta esa clave: GEMINI_API_KEY,
# DEEPSEEK_API_KEY, OPENROUTER_API_KEY o GROQ_API_KEY. (Ollama es local: no corre aquí.)
#
# modo "arrancar" crea un asset NUEVO desde cero (spec.json + build.py) a partir de una
# descripción y una imagen ya subida al repo: la primera versión también la escribe la IA,
# no hace falta que nadie escriba Python a mano para empezar.
#
# El resultado queda en una rama `bucle/<asset>-<n>` con el build.py nuevo, la última hoja
# de contacto y el resumen. Nada se mezcla a main sin que tú lo apruebes.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Carpeta del asset (p. ej. assets/pruebas/joven_rubio_v1 o lata). En modo 'arrancar', el nombre nuevo que se va a crear."
        required: true
      modo:
        description: "correr = seguir un asset que ya existe | arrancar = crear uno nuevo (spec.json + build.py) desde una descripción y una foto"
        default: "correr"
      descripcion:
        description: "Solo para 'arrancar': qué es y su tamaño real, p. ej. \"espada larga medieval, 90 cm\""
        default: ""
      referencia:
        description: "Ruta de una imagen de referencia ya subida al repo (p. ej. refs/pendientes/espada-123.jpg). Obligatoria en 'arrancar'; en 'correr' reemplaza la referencia de esa corrida"
        default: ""
      vueltas:
        description: "Vueltas máximas"
        default: "4"
      proveedor:
        description: "auto = prueba Gemini y si se topa con cuota brinca solo a Groq (recomendado) | gemini | deepseek | openrouter | groq | personalizado"
        default: "auto"
      modelo:
        description: "Modelo (vacío = el de fábrica del proveedor)"
        default: ""
      nota:
        description: "Indicación para el modelo (opcional)"
        default: ""
      editables:
        description: "Archivos extra que puede reescribir, separados por coma (p. ej. alth/pelo.py)"
        default: ""
      rama_base:
        description: "Rama de la que parte. 'auto' = sigue desde la última corrida de ESTE asset (encadena vueltas)"
        default: "auto"

permissions:
  contents: write

jobs:
  bucle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Elegir la rama de partida
        id: rama
        env:
          GH_TOKEN: ${{ github.token }}
          IN_ASSET: ${{ inputs.asset }}
          IN_RAMA_BASE: ${{ inputs.rama_base }}
        run: |
          nombre="$(basename "$IN_ASSET")"
          if [ "$IN_RAMA_BASE" = "auto" ]; then
            ultima="$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate -q '.[].name' \
              | grep -E "^bucle/${nombre}-[0-9]+$" | sort -V | tail -1)"
            if [ -n "$ultima" ]; then
              echo "Encadenando desde la última corrida: $ultima"
              echo "ref=$ultima" >> "$GITHUB_OUTPUT"
            else
              echo "No hay corridas previas de '$nombre'; empiezo desde main"
              echo "ref=main" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=$IN_RAMA_BASE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rama.outputs.ref }}
          fetch-depth: 0

      - name: Herramientas siempre de main
        if: steps.rama.outputs.ref != 'main'
        run: |
          # Al encadenar desde una rama bucle/* vieja, su tools/bucle.py también es viejo (así falló
          # la corrida 6: "proveedor desconocido: auto"). Regla: herramientas, pruebas, spec y la
          # librería alth/ vienen de main; SOLO se conservan de la rama los archivos que el bucle
          # editó ahí (p. ej. alth/pelo.py) y la carpeta del asset.
          git fetch -q origin main
          editados="$(git log --format= --name-only origin/main..HEAD -- alth/ | sort -u)"
          git checkout origin/main -- tools/ tests/ alth/ spec/ AGENTS.md
          for f in $editados; do git checkout HEAD -- "$f" 2>/dev/null && echo "conservo de la rama: $f"; done
          echo "Herramientas al día con main ($(git rev-parse --short origin/main))."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Librerías del sistema para Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Blender sin interfaz (bpy)
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash tools/ensure_blender.sh --strict
          pip install -q numpy pillow scipy

      - name: Correr el bucle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALTH_API_KEY: ${{ secrets.ALTH_API_KEY }}
          ALTH_API_BASE: ${{ vars.ALTH_API_BASE }}
          ALTH_PROGRESO_TOKEN: ${{ github.token }}   # barra de % del Taller (rama progreso)
          IN_ASSET: ${{ inputs.asset }}
          IN_MODO: ${{ inputs.modo }}
          IN_DESCRIPCION: ${{ inputs.descripcion }}
          IN_REFERENCIA: ${{ inputs.referencia }}
          IN_VUELTAS: ${{ inputs.vueltas }}
          IN_PROVEEDOR: ${{ inputs.proveedor }}
          IN_MODELO: ${{ inputs.modelo }}
          IN_NOTA: ${{ inputs.nota }}
          IN_EDITABLES: ${{ inputs.editables }}
        run: |
          export ALTH_PYTHON="$(command -v alth-python)"
          if [ "$IN_MODO" = "arrancar" ]; then
            [ -n "$IN_DESCRIPCION" ] && [ -n "$IN_REFERENCIA" ] || {
              echo "Modo 'arrancar' necesita 'descripcion' y 'referencia'."; exit 1; }
            args=(arrancar "$IN_ASSET" --descripcion "$IN_DESCRIPCION" --ref "$IN_REFERENCIA" \
                  --vueltas "$IN_VUELTAS" --proveedor "$IN_PROVEEDOR")
            [ -n "$IN_MODELO" ] && args+=(--modelo "$IN_MODELO")
          else
            args=(correr "$IN_ASSET" --vueltas "$IN_VUELTAS" --proveedor "$IN_PROVEEDOR")
            [ -n "$IN_MODELO" ] && args+=(--modelo "$IN_MODELO")
            [ -n "$IN_NOTA" ] && args+=(--nota "$IN_NOTA")
            if [ -n "$IN_REFERENCIA" ]; then
              # foto nueva subida a main desde el Taller: tráela aunque partamos de una rama bucle/*
              [ -f "$IN_REFERENCIA" ] || { git fetch -q origin main && git checkout origin/main -- "$IN_REFERENCIA"; }
              args+=(--ref "$IN_REFERENCIA")
            fi
            IFS=',' read -ra EXTRA <<< "$IN_EDITABLES"
            for e in "${EXTRA[@]}"; do e="$(echo "$e" | xargs)"; [ -n "$e" ] && args+=(--editable "$e"); done
          fi
          set -o pipefail
          python3 -u tools/bucle.py "${args[@]}" 2>&1 | tee bucle.log

      - name: Mostrar el motivo del fallo
        if: failure()
        run: |
          # El motivo queda como anotación roja en la corrida (se ve sin abrir el log, también
          # desde el celular y desde la API) y en el resumen.
          [ -f bucle.log ] || { echo "::error title=Bucle ALTH::Falló antes de arrancar el bucle (revisa los pasos de arriba)"; exit 0; }
          motivo="$(grep -E '^\[bucle\]|Error|error' bucle.log | tail -12)"
          [ -n "$motivo" ] || motivo="$(tail -12 bucle.log)"
          msg="$(printf '%s' "$motivo" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')"
          echo "::error title=Bucle ALTH — por qué falló::$msg"
          { echo "### Por qué falló"; echo '```'; tail -25 bucle.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultado en una rama
        if: always()
        env:
          IN_ASSET: ${{ inputs.asset }}
        run: |
          d="$IN_ASSET"; [ -d "$d" ] || d="assets/$IN_ASSET"
          nombre="$(basename "$d")"
          trabajo="renders/$nombre/bucle"
          [ -d "$trabajo" ] || { echo "No hubo resultados"; exit 0; }
          mkdir -p "$d/bucle"
          # la hoja de la vuelta que el bucle ELIGIÓ (pasa verificación + mejor silueta), no la última
          elegida="$(cat "$trabajo/elegida.txt" 2>/dev/null)"
          if [ -n "$elegida" ] && [ -d "$trabajo/$elegida" ]; then ultima="$trabajo/$elegida"
          else ultima="$(ls -d "$trabajo"/v* | sort | tail -1)"; fi
          cp "$trabajo/resumen.md" "$d/bucle/" 2>/dev/null || true
          cp "$trabajo/error.txt" "$d/bucle/" 2>/dev/null || rm -f "$d/bucle/error.txt"
          cp "$ultima/hoja.png" "$d/bucle/hoja_ultima.png" 2>/dev/null || true
          cp "$trabajo/superposicion.png" "$d/bucle/siluetas.png" 2>/dev/null || true
          rama="bucle/${nombre}-${{ github.run_number }}"
          git config user.name "bucle-alth"
          git config user.email "bucle-alth@users.noreply.github.com"
          git checkout -b "$rama"
          git add -A "$d" alth/
          git commit -m "bucle: $nombre (${{ inputs.proveedor }} ${{ inputs.modelo }}), corrida ${{ github.run_number }}" || exit 0
          git push origin "$rama"
          {
            echo "_Partió de: \`${{ steps.rama.outputs.ref }}\`_"
            echo
            cat "$d/bucle/resumen.md" 2>/dev/null
            if [ -f "$d/bucle/error.txt" ]; then echo; echo "### Error del modelo"; echo '```'; cat "$d/bucle/error.txt"; echo '```'; fi
            echo
            echo "Rama: \`$rama\`"
            echo
            echo "![hoja](https://github.com/${{ github.repository }}/blob/$rama/$d/bucle/hoja_ultima.png?raw=true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir todas las vueltas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucle-renders
          path: renders/
          if-no-files-found: ignore
