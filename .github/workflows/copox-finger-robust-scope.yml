name: COPOX · Finger robust scope

on:
  pull_request:
    paths:
      - "copox/adapters/finger_reference_extrude_build.py"
      - "copox/production/finger_robust_scope_trial.py"
      - ".github/workflows/copox-finger-robust-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar análisis
        run: python3 -m pip install -q numpy scipy trimesh Pillow
      - name: Ejecutar tres alcances distales
        run: |
          rm -rf .copox/finger-robust-scope
          for SLOT in 1 2 3; do
            python3 -m copox.production.finger_robust_scope_trial \
              --baseline assets/joven_rubio/theo_alpha.glb \
              --reference refs/personajes/joven-rubio-4-vistas.jpg \
              --config copox/reference_configs/joven_rubio_alpha.json \
              --policy copox/production/theo_m5_policy.json \
              --slot "$SLOT" \
              --output-dir ".copox/finger-robust-scope/c0${SLOT}"
          done
      - name: Resumir scope sin promoción
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.copox/finger-robust-scope'); rows=[]
          for p in sorted(root.glob('c*/trial.json')):
              t=json.loads(p.read_text()); r=t['result']; d=t['hand_detail']['summary']
              rows.append({'candidate':p.parent.name,'delete_distal_fraction':r['params']['delete_distal_fraction'],'semantic_ready':r['semantic_ready'],'reference_valleys':d['reference_valleys'],'model_valleys':d['model_valleys'],'target_gain_pp':r['target_gain_pp'],'global_gain_pp':r['global_gain_pp'],'worst_view_delta_pp':r['worst_view_delta_pp'],'regression_ok':r['regression_ok'],'reasons':t['gate']['reasons']})
          assert len(rows)==3
          sha=hashlib.sha256(Path('assets/joven_rubio/theo_alpha.glb').read_bytes()).hexdigest()
          assert sha=='ed2b04ecd9e22a19794591b873c19c2b30323a9ae836f7dd820134bd0113580b'
          ranking=sorted(rows,key=lambda x:(x['semantic_ready'],x['regression_ok'],x['global_gain_pp'],x['worst_view_delta_pp'],x['target_gain_pp']),reverse=True)
          (root/'summary.json').write_text(json.dumps({'baseline_sha256':sha,'promotion_executed':False,'ranking':ranking},indent=2))
          print(json.dumps(ranking,indent=2))
          PY
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copox-finger-robust-scope
          path: .copox/finger-robust-scope/
          retention-days: 1
          if-no-files-found: ignore
