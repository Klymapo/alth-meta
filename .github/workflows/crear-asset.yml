name: Crear asset (línea única)
run-name: "Crear · ${{ inputs.nombre || github.event.issue.title }}"

# Entrada única: imagen + nombre + tamaño real. Sin IA ni claves.
#  - Desde la app de GitHub en el celular: abre un issue con la plantilla "Crear asset" (adjunta la
#    foto), o Actions → "Crear asset (línea única)" → Run workflow con una imagen que ya esté en refs/.
#  - Encadena reconocer → capacidades → investigar (si hay brechas) → receta → construir → ajustar
#    → AUDITORÍA VISUAL contra la referencia, que decide (tools/auditoria_visual.py).
#  - Deja la hoja, la comparación y el resumen como artifact y como comentario del issue.
#  - Con auditoría PASS (y sin faltantes) abre un PR de publicación (tools/publicar_pr.sh). Nunca
#    empuja a main: el dueño fusiona el PR.
#  - El job sale en ROJO si el asset no quedó aprobado (verificación, auditoría o faltantes).
on:
  workflow_dispatch:
    inputs:
      imagen:
        description: "Ruta de la imagen en el repo (p. ej. refs/infografias/objeto-01-manzana.png)"
        required: true
      nombre:
        description: "Nombre (p. ej. manzana)"
        required: true
      tamano:
        description: "Tamaño REAL (p. ej. 8cm)"
        required: true
      recorte:
        description: "Opcional: x0,y0,x1,y1 (infografías)"
        default: ""
  issues:
    types: [opened, labeled]

permissions:
  contents: write     # sólo ramas linea/revision-issue-N y publicar/* (nunca main)
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash       # pipefail

concurrency:   # abrir con la plantilla dispara "opened" y "labeled": solo sigue la última
  group: crear-asset-${{ github.event.issue.number || inputs.nombre }}
  cancel-in-progress: true

jobs:
  crear:
    # no reacciona a las etiquetas aprobado/rechazado (esas son de aprobar-linea.yml)
    # Solo issues del dueño o de colaboradores: el repo es público y este job corre con un token
    # de escritura, así que un issue de cualquier persona no debe disparar nada.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        (
          (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'crear-asset')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'crear-asset')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Blender headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash tools/ensure_blender.sh --strict
          uv pip install --python "$(alth-python -c 'import sys; print(sys.executable)')" numpy scipy Pillow
      - name: Entrada
        id: entrada
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IN_IMAGEN: ${{ inputs.imagen }}
          IN_NOMBRE: ${{ inputs.nombre }}
          IN_TAMANO: ${{ inputs.tamano }}
          IN_RECORTE: ${{ inputs.recorte }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            alth-python tools/entrada_issue.py "$GITHUB_EVENT_PATH" --destino refs/pendientes > entrada.json
          else
            alth-python -c "import json,os; print(json.dumps({'imagen': os.environ['IN_IMAGEN'], 'nombre': os.environ['IN_NOMBRE'], 'tamano': os.environ['IN_TAMANO'], 'recorte': os.environ.get('IN_RECORTE') or None}))" > entrada.json
          fi
          cat entrada.json
      - name: Línea única
        id: linea
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ID (sólo [a-z0-9_]) para rutas; el nombre tal cual sólo va como argumento entre comillas.
          read -r IMG NOM ID TAM REC < <(alth-python -c "import json,sys; sys.path.insert(0,'tools'); import reconocer as r; e=json.load(open('entrada.json')); print(e['imagen'], e['nombre'].replace(' ','_'), r.nombre_id(e['nombre']), e['tamano'].replace(' ',''), e.get('recorte') or '-')")
          args=(--imagen "$IMG" --nombre "$NOM" --tamano "$TAM" --salida ".linea/crear/$ID")
          [ "$REC" != "-" ] && args+=(--recorte "$REC")
          mkdir -p .linea
          set +e
          alth-python tools/crear_asset.py "${args[@]}" 2>&1 | grep -v -E "INFO|CUEW|^Fra|Saved" | tee .linea/crear_salida.txt
          code=${PIPESTATUS[0]}
          echo "salida=$code" >> "$GITHUB_OUTPUT"
          echo "carpeta=.linea/crear/$ID" >> "$GITHUB_OUTPUT"
          # el código real se aplica en el último paso ("Resultado"), después de comentar el issue
          exit 0
      - name: Resumen
        if: always()
        env:
          CARPETA: ${{ steps.linea.outputs.carpeta }}
        run: |
          r="$CARPETA/resumen.json"
          [ -f "$r" ] && alth-python tools/resumen_linea.py "$r" >> "$GITHUB_STEP_SUMMARY" || echo "sin resumen" >> "$GITHUB_STEP_SUMMARY"
      - name: Hoja de revisión en el issue (rama linea/revision-issue-N, no main)
        id: revision
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          CARPETA: ${{ steps.linea.outputs.carpeta }}
        run: |
          rama="linea/revision-issue-$N"
          if [ ! -f "$CARPETA/receta.json" ] || [ ! -f "$CARPETA/resumen.json" ]; then
            { echo "No se pudo armar el asset. Faltantes:"; echo; alth-python tools/resumen_linea.py "$CARPETA/resumen.json" 2>/dev/null || cat .linea/crear_salida.txt | tail -20; } > comentario.md
            gh issue comment "$N" --body-file comentario.md
            exit 0
          fi
          nom=$(basename "$CARPETA")
          alth-python tools/hoja_revision.py "$CARPETA" --salida "$CARPETA/revision.png"
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          hoja=$(alth-python -c "import json,sys; print(json.load(open(sys.argv[1]))['final']['hoja'])" "$CARPETA/resumen.json")
          dest="revision/$nom"
          mkdir -p "$dest"
          cp "$CARPETA"/{receta.json,resumen.json,ficha.json,capacidades.json,investigacion.json,revision.png} "$dest"/
          cp "$hoja" "$dest/hoja.png"
          [ -d "$CARPETA/auditoria" ] && cp -r "$CARPETA/auditoria" "$dest/"
          [ -f entrada.json ] && cp entrada.json "$dest/"
          img=$(alth-python -c "import json; print(json.load(open('entrada.json'))['imagen'])")
          git config user.name "alth-linea[bot]"
          git config user.email "alth-linea@users.noreply.github.com"
          git checkout -B "$rama"
          git add -f "$dest" "$img"
          for k in kb/investigacion.json kb/investigacion; do [ -e "$k" ] && git add -f "$k"; done
          true
          git commit -q -m "revisión: $nom (issue #$N, sin publicar)"
          git push -q -f origin "$rama"
          url="https://github.com/${{ github.repository }}/blob/$rama/$dest/revision.png?raw=true"
          corrida="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          comp=()
          [ -f "$dest/auditoria/comparacion.png" ] && comp=(--comparacion "https://github.com/${{ github.repository }}/blob/$rama/$dest/auditoria/comparacion.png?raw=true")
          alth-python tools/resumen_linea.py "$CARPETA/resumen.json" --comentario --imagen "$url" --rama "$rama" --corrida "$corrida" "${comp[@]}" > comentario.md
          gh issue comment "$N" --body-file comentario.md
      - name: Publicar por PR (sólo con auditoría PASS)
        if: github.event_name == 'issues' && steps.linea.outputs.salida == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          CARPETA: ${{ steps.linea.outputs.carpeta }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RAMA_REVISION: ${{ steps.revision.outputs.rama }}
        run: bash tools/publicar_pr.sh "$CARPETA" "$N" "$RAMA_REVISION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crear-asset-${{ github.run_id }}
          path: .linea/
          include-hidden-files: true
          retention-days: 14
      - name: Resultado (rojo si el asset no quedó aprobado por la auditoría)
        if: always()
        env:
          code: ${{ steps.linea.outputs.salida }}
        run: |
          case "$code" in
            0) echo "APROBADO_POR_AUDITORIA" ;;
            3) echo "::error::La auditoría visual rechazó el asset (ver auditoria/comparacion.png en el artifact)"; exit 3 ;;
            4) echo "::error::Faltantes: no se pudo construir o falta una capacidad (ver resumen)"; exit 4 ;;
            "") echo "::error::La línea no llegó a correr"; exit 1 ;;
            *) echo "::error::Falló la verificación técnica o la línea (código $code)"; exit "$code" ;;
          esac
