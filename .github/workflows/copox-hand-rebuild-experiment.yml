name: COPOX · Web-informed hand rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hand-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Blender, numpy y auditoría
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy >/dev/null
          python3 -m pip install -q numpy scipy trimesh Pillow
          blender -b --python-expr "import numpy; print('BLENDER_NUMPY_OK', numpy.__version__)"
      - name: Generar tres reconstrucciones experimentales
        run: |
          rm -rf .copox/hand-rebuild
          mkdir -p .copox/hand-rebuild
          for SLOT in 1 2 3; do
            mkdir -p ".copox/hand-rebuild/c0$SLOT"
            blender -b --python copox/adapters/hand_rebuild_experiment.py -- \
              --input assets/joven_rubio/theo_alpha.glb \
              --config copox/reference_configs/joven_rubio_alpha.json \
              --slot "$SLOT" \
              --output ".copox/hand-rebuild/c0$SLOT/candidate.glb" \
              --report ".copox/hand-rebuild/c0$SLOT/report.json"
          done
      - name: Auditar silueta, manos y regresión
        run: |
          for SLOT in 1 2 3; do
            ROOT=".copox/hand-rebuild/c0$SLOT"
            python3 -m copox.adapters.alth_character_audit \
              --prev assets/joven_rubio/theo_alpha.glb \
              --curr "$ROOT/candidate.glb" \
              --reference refs/personajes/joven-rubio-4-vistas.jpg \
              --focus hands,fingers \
              --config copox/reference_configs/joven_rubio_alpha.json \
              --output "$ROOT/audit.json" \
              --evidence-dir "$ROOT/audit_evidence"
            python3 -m copox.adapters.hand_detail_probe \
              --model "$ROOT/candidate.glb" \
              --reference refs/personajes/joven-rubio-4-vistas.jpg \
              --config copox/reference_configs/joven_rubio_alpha.json \
              --output "$ROOT/hand_detail.json" \
              --evidence-dir "$ROOT/hand_detail_evidence"
          done
      - name: Resumir resultado experimental
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          rows=[]
          for root in sorted(Path('.copox/hand-rebuild').glob('c*')):
              r=json.loads((root/'report.json').read_text())
              a=json.loads((root/'audit.json').read_text())
              h=json.loads((root/'hand_detail.json').read_text())['summary']
              assert r['promotion_allowed'] is False
              assert r['created_count'] > 0
              visual=a['visual']
              rows.append({
                  'candidate':root.name,
                  'slot':r['slot'],
                  'created_count':r['created_count'],
                  'weighted_gain_pp':visual['weighted_gain_pp'],
                  'relevant_region_gain_pp':visual['relevant_region_gain_pp'],
                  'worst_view_delta_pp':min(visual['full']['delta_pp'][v] for v in ('front','side','back','threeq')),
                  'definition_match':h['definition_match'],
                  'reference_valleys':h['reference_valleys'],
                  'model_valleys':h['model_valleys'],
                  'frozen_regions_ok':a['regression']['frozen_regions_ok'],
              })
          assert len(rows)==3
          sha=hashlib.sha256(Path('assets/joven_rubio/theo_alpha.glb').read_bytes()).hexdigest()
          assert sha=='ed2b04ecd9e22a19794591b873c19c2b30323a9ae836f7dd820134bd0113580b'
          ranking=sorted(rows,key=lambda x:(x['definition_match'],x['relevant_region_gain_pp'],x['weighted_gain_pp']),reverse=True)
          summary={'baseline_sha256':sha,'promotion_executed':False,'research_stage_only':True,'ranking':ranking}
          Path('.copox/hand-rebuild/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copox-web-informed-hand-rebuild
          path: .copox/hand-rebuild/
          retention-days: 1
