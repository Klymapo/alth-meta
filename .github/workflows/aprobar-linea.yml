name: Aprobar asset (línea única)
run-name: "Aprobar · issue #${{ github.event.issue.number }} · ${{ github.event.label.name }}"

# La AUDITORÍA VISUAL decide (decisión del dueño, 1 oct 2026). Normalmente "Crear asset" ya abre el PR
# de publicación cuando la auditoría da PASS. Esta etiqueta sirve para reintentarlo a mano:
#   aprobado  → reconstruye en modo final desde la receta revisada (rama linea/revision-issue-N),
#               vuelve a auditar y, SÓLO con PASS, abre un PR con assets/<nombre>/ (GLB raíz ×0.01,
#               final.png, spec.json, evidencia), fila en data/medidas.csv, capacidades y huella.
#               Con FAIL no publica nada aunque tenga la etiqueta, y el job sale en rojo.
#   rechazado → no publica nada; lo deja anotado en el issue.
# Nunca empuja a main: entra a main cuando el dueño fusiona el PR.
on:
  issues:
    types: [labeled]

permissions:
  contents: write        # sólo ramas publicar/* (nunca main)
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash          # pipefail: un fallo dentro de "| tee" pone el job en rojo

concurrency:
  group: publicar-main
  cancel-in-progress: false

jobs:
  aprobar:
    # Publicar a main solo cuando la etiqueta la pone el dueño del repo (github.event.sender).
    if: >-
      contains(github.event.issue.labels.*.name, 'crear-asset') &&
      (github.event.label.name == 'aprobado' || github.event.label.name == 'rechazado') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.event.issue.number }}
    steps:
      - name: Rechazado
        if: github.event.label.name == 'rechazado'
        run: |
          gh issue comment "$N" -R "${{ github.repository }}" --body "Rechazado: no se publica nada. La revisión queda en la rama linea/revision-issue-$N como historial."
      - uses: actions/checkout@v4
        if: github.event.label.name == 'aprobado'
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: github.event.label.name == 'aprobado'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        if: github.event.label.name == 'aprobado'
      - name: Blender headless
        if: github.event.label.name == 'aprobado'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash tools/ensure_blender.sh --strict
          uv pip install --python "$(alth-python -c 'import sys; print(sys.executable)')" numpy scipy Pillow
      - name: Publicar lo revisado (auditoría + PR)
        if: github.event.label.name == 'aprobado'
        run: |
          rama="linea/revision-issue-$N"
          git fetch -q origin "$rama" || { gh issue comment "$N" --body "No encontré la rama \`$rama\`: no hay revisión que aprobar."; exit 1; }
          git checkout -q "origin/$rama" -- revision
          git checkout -q "origin/$rama" -- kb/investigacion.json kb/investigacion 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/rev" && cp -r revision/. "$RUNNER_TEMP/rev/"
          git rm -r -q --cached revision && rm -rf revision
          carpeta=$(ls -d "$RUNNER_TEMP"/rev/*/ | head -1)
          git config user.name "alth-linea[bot]"
          git config user.email "alth-linea@users.noreply.github.com"
          BASE_BRANCH="${{ github.event.repository.default_branch }}" bash tools/publicar_pr.sh "$carpeta" "$N" "origin/$rama"
      - uses: actions/upload-artifact@v4
        if: always() && github.event.label.name == 'aprobado'
        with:
          name: aprobar-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rev/
            publicar.json
            publicar_err.txt
          retention-days: 14
          if-no-files-found: warn
