name: COPOX · M5 engine validation

on:
  pull_request:
    paths:
      - "copox/adapters/alth_model_m5.py"
      - "copox/adapters/alth_model_m5_cycle.py"
      - "copox/production/**"
      - "copox/profiles/alth_model_m5.json"
      - "copox/cassettes/examples/theo_model_m5_validation.json"
      - "copox/adapters/finger_reference_fit.py"
      - "copox/adapters/finger_valley_carve.py"
      - "copox/adapters/hand_detail_probe.py"
      - "copox/adapters/regional_vertex_morph.py"
      - ".github/workflows/copox-m5-engine-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar análisis
        run: python3 -m pip install -q numpy scipy trimesh Pillow

      - name: Ejecutar hasta tres torneos sin persistencia
        run: |
          rm -rf .copox/engine-validation
          set +e
          python3 -m copox.engine copox/cassettes/examples/theo_model_m5_validation.json \
            --output-root .copox/engine-validation
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "Engine terminó con código inesperado: $RC" >&2
            exit "$RC"
          fi
          echo "$RC" > .copox/engine-validation/exit_code.txt

      - name: Verificar contrato real y progreso semántico
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.copox/engine-validation')
          manifests=list(root.rglob('manifest.json'))
          assert len(manifests)==1, manifests
          manifest=json.loads(manifests[0].read_text())
          assert manifest['status'] in {'PLATEAU','PROMOTED'}, manifest['status']
          assert 1 <= len(manifest['candidates']) <= 9
          assert all(c['status'] in {'REJECTED','ELIGIBLE','ERROR'} for c in manifest['candidates'])
          cassette=json.loads(Path('copox/cassettes/examples/theo_model_m5_validation.json').read_text())
          assert 'promote' not in cassette['commands']
          assert 'state_branch' not in cassette.get('variables',{})
          sha=hashlib.sha256(Path('assets/joven_rubio/theo_alpha.glb').read_bytes()).hexdigest()
          assert sha=='ed2b04ecd9e22a19794591b873c19c2b30323a9ae836f7dd820134bd0113580b'

          run_dir=manifests[0].parent
          tournaments=sorted({int(c['tournament']) for c in manifest['candidates']})
          expected_round={1:1,2:2,3:3}
          for tournament in tournaments:
              specs=[json.loads(p.read_text()) for p in sorted((run_dir/'candidates').glob(f't{tournament:02d}-c*/module_spec.json'))]
              assert specs
              assert {s['module'] for s in specs} == {'fingers'}, specs
              assert {int(s['technique_round']) for s in specs} == {expected_round[tournament]}, specs
              if tournament >= 2:
                  for p in (run_dir/'candidates').glob(f't{tournament:02d}-c*/module_spec.json'):
                      morph=json.loads((p.parent/'morph.json').read_text())
                      assert bool(morph.get('topology_refine')), morph
                      refine=morph['topology_refine']
                      assert refine['topology_density_increased'] is True
                      assert refine['safe_geometry_regression'] is True

          if 3 in tournaments:
              progress=[]
              for p in (run_dir/'candidates').glob('t03-c*/module_spec.json'):
                  morph=json.loads((p.parent/'morph.json').read_text())
                  result=json.loads((p.parent/'module_result.json').read_text())
                  assert morph['mode']=='finger_reference_valley_carve', morph.get('mode')
                  assert morph['total_reference_valleys'] >= 1, morph
                  assert morph['outside_scope_exact'] is True
                  sem=result.get('semantic_progress') or {}
                  progress.append(float(sem.get('gap_improvement',0.0)))
              assert progress and max(progress) > 0.0, f'Valley carve no redujo gap semántico: {progress}'

          if manifest['status']=='PLATEAU':
              assert tournaments == [1,2,3], tournaments
              assert (run_dir/'learning_t01.json').exists()
              assert (run_dir/'learning_t02.json').exists()
              assert (run_dir/'learning_t03.json').exists()
              learning3=json.loads((run_dir/'learning_t03.json').read_text())
              assert learning3['attempted_techniques'] == 3
              assert learning3['next_technique_round'] is None
              assert 'fingers' in learning3['cooldown_modules']
          print(json.dumps({'status':manifest['status'],'candidates':len(manifest['candidates']),'tournaments':tournaments}, indent=2))
          PY

      - name: Evidencia engine M5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copox-theo-m5-engine-validation
          path: .copox/engine-validation/
          retention-days: 1
          if-no-files-found: ignore
