name: COPOX · Finger reference extrusion

on:
  pull_request:
    paths:
      - "copox/adapters/finger_reference_extrude_plan.py"
      - "copox/adapters/finger_reference_extrude_build.py"
      - "copox/production/finger_reference_extrude_trial.py"
      - "copox/adapters/hand_detail_probe.py"
      - "copox/reference_configs/joven_rubio_alpha.json"
      - "assets/joven_rubio/theo_alpha.glb"
      - "refs/personajes/joven-rubio-4-vistas.jpg"
      - ".github/workflows/copox-finger-reference-extrude.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-extrusion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar análisis
        run: python3 -m pip install -q numpy scipy trimesh Pillow

      - name: Ejecutar tres prototipos extruidos learning-only
        run: |
          rm -rf .copox/finger-reference-extrude
          for SLOT in 1 2 3; do
            python3 -m copox.production.finger_reference_extrude_trial \
              --baseline assets/joven_rubio/theo_alpha.glb \
              --reference refs/personajes/joven-rubio-4-vistas.jpg \
              --config copox/reference_configs/joven_rubio_alpha.json \
              --policy copox/production/theo_m5_policy.json \
              --slot "$SLOT" \
              --output-dir ".copox/finger-reference-extrude/c0${SLOT}"
          done

      - name: Resumir aprendizaje sin promoción
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.copox/finger-reference-extrude')
          rows=[]
          for p in sorted(root.glob('c*/trial.json')):
              t=json.loads(p.read_text())
              assert t['promotion_executed'] is False
              assert t['plan']['reference_driven'] is True
              assert t['plan']['invented_finger_count'] is False
              assert t['build']['bridge_to_palm_validated'] is False
              assert t['build']['loop_rings_per_digit'] >= 3
              assert t['gate']['promotion_allowed'] is False
              l=t['learning']; r=t['result']
              rows.append({
                  'candidate':p.parent.name,
                  'visible_bands':t['plan']['visible_band_count'],
                  'segments':t['params']['segments'],
                  'left_definition_match':l['left_definition_match'],
                  'left_component_gap':l['left_component_gap'],
                  'left_valley_gap':l['left_valley_count_gap'],
                  'reference_left_valleys':l['reference_left_valleys'],
                  'model_left_valleys':l['model_left_valleys'],
                  'target_gain_pp':r['target_gain_pp'],
                  'global_gain_pp':r['global_gain_pp'],
                  'worst_view_delta_pp':r['worst_view_delta_pp'],
                  'reasons':t['gate']['reasons'],
              })
          assert len(rows)==3, rows
          sha=hashlib.sha256(Path('assets/joven_rubio/theo_alpha.glb').read_bytes()).hexdigest()
          assert sha=='ed2b04ecd9e22a19794591b873c19c2b30323a9ae836f7dd820134bd0113580b', sha
          ranking=sorted(rows,key=lambda x:(x['left_definition_match'],-x['left_valley_gap'],-x['left_component_gap'],x['target_gain_pp'],x['global_gain_pp']),reverse=True)
          summary={
              'baseline_sha256':sha,
              'promotion_executed':False,
              'research_stage_only':True,
              'ranking':ranking,
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Evidencia de extrusión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copox-theo-finger-reference-extrude
          path: .copox/finger-reference-extrude/
          retention-days: 1
          if-no-files-found: ignore
